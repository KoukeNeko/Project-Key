[Metadata]
Name=Project Key
Version=1
Author=Project Key
Description=The Project Key candidate window's look: dark, rounded, with the accent color on the selection. Fcitx5 draws its panel with it where Project Key cannot draw its own window (Wayland), and for the other input methods.
ScaleWithDPI=True

# Colors from core/engine/PanelMetrics.h; images from tools/icon/make-icons.ps1.
[InputPanel]
NormalColor=#e8ecee
HighlightCandidateColor=#ffffff
# Highlighted text: the selected cell of the expanded grid and the word being chosen in the proof
# row, white on the accent color as the selected candidate is.
HighlightColor=#ffffff
HighlightBackgroundColor=#14806f
PageButtonAlignment=Last Candidate
Spacing=2
# Blur behind the window inside its corners (the background image's shape), where KWin or the
# compositor offers it; panel.png is translucent for it.
EnableBlur=True
BlurMask=panel.png

# Each candidate: 11px beside the text, 5 above and 6 below, as in the candidate cells.
[InputPanel/TextMargin]
Left=11
Right=11
Top=5
Bottom=6

# 6px inside the window edge, as around the candidate row.
[InputPanel/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/Background]
Image=panel.png

[InputPanel/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[InputPanel/Highlight]
Image=highlight.png

# The selection reaches as far as the cell's padding (TextMargin), as the candidate cells' does.
[InputPanel/Highlight/Margin]
Left=11
Right=11
Top=5
Bottom=6

[InputPanel/PrevPage]
Image=prev.png

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.png

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#e8ecee
HighlightCandidateColor=#ffffff
Spacing=0
EnableBlur=True
BlurMask=panel.png

[Menu/Background]
Image=panel.png

[Menu/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/Highlight]
Image=highlight.png

[Menu/Highlight/Margin]
Left=11
Right=11
Top=5
Bottom=6

[Menu/Separator]
Color=#343b40

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=11
Right=11
Top=5
Bottom=6
