name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Builds the input method and runs the engine and IMK controller tests.
  macos:
    runs-on: macos-26  # NSGlassEffectView needs the macOS 26 SDK
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # llama.cpp for the advanced model (core/engine/AdvancedModel.h), at LLAMA_RELEASE.
      - run: tools/fetch-llama.sh llama.cpp
      - run: platforms/macos/build.sh
        env:
          PROJECTKEY_LLAMA: ${{ github.workspace }}/llama.cpp

  # Builds the app and keyboard for the iOS Simulator.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: platforms/ios/build.sh

  # Builds the text service, server and settings app, and runs the engine and protocol tests.
  windows:
    strategy:
      matrix:
        runner: [windows-2025, windows-11-arm]  # x64 and ARM64: build.ps1 builds for the machine it runs on
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      # llama.cpp for the advanced model (core/engine/AdvancedModel.h), at LLAMA_RELEASE.
      - run: tools/fetch-llama.sh llama.cpp
        shell: bash
      - run: platforms/windows/build.ps1
        shell: pwsh
        env:
          PROJECTKEY_LLAMA: ${{ github.workspace }}\llama.cpp

  # Builds the Fcitx5 addon and settings window, and runs the engine and controller tests.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev libenchant-2-dev libxcb1-dev libcairo2-dev libpango1.0-dev qt6-base-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev
      # llama.cpp for the advanced model (core/engine/AdvancedModel.h), at LLAMA_RELEASE.
      - run: tools/fetch-llama.sh llama.cpp
      - run: platforms/linux/build.sh
        env:
          PROJECTKEY_LLAMA: ${{ github.workspace }}/llama.cpp

  # The same on Ubuntu 22.04: Fcitx5 5.0, libwayland 1.20, libadwaita 1.1 (the Qt settings window
  # only) and GNOME 42 (the extension rewritten in its older form).
  linux-jammy:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl build-essential cmake ninja-build python3 pkg-config \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev libenchant-2-dev libxcb1-dev libcairo2-dev \
            libpango1.0-dev libwayland-dev qt6-base-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: tools/fetch-llama.sh llama.cpp
      - run: platforms/linux/build.sh
        env:
          PROJECTKEY_LLAMA: ${{ github.workspace }}/llama.cpp
