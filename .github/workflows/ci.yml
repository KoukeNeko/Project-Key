name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Builds the input method and runs the engine and IMK controller tests.
  macos:
    runs-on: macos-26  # NSGlassEffectView needs the macOS 26 SDK
    steps:
      - uses: actions/checkout@v4
      - run: platforms/macos/build.sh

  # Builds the app and keyboard for the iOS Simulator.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: platforms/ios/build.sh

  # Builds the text service, server and settings app, and runs the engine and protocol tests.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: platforms/windows/build.ps1
        shell: pwsh

  # Builds the Fcitx5 addon and settings window, and runs the engine and controller tests.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev libenchant-2-dev libxcb1-dev libcairo2-dev libpango1.0-dev qt6-base-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev
      - run: platforms/linux/build.sh
