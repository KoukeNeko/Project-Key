name: Release

# Pushing a tag vX.Y.Z, where X.Y.Z is the version in Info.plist, ProjectKey.rc and the Linux CMakeLists.txt,
# builds both platforms, publishes the GitHub release, and points the Homebrew cask
# and the Scoop manifest at its files and the Homebrew formula (Linux) at its source.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          mac="$(/usr/bin/env python3 -c 'import plistlib; print(plistlib.load(open("platforms/macos/Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
          win="$(sed -n 's/.*VALUE "ProductVersion", "\(.*\)".*/\1/p' platforms/windows/Sources/TextService/ProjectKey.rc)"
          linux="$(sed -n 's/^project(.* VERSION \([0-9.]*\).*/\1/p' platforms/linux/CMakeLists.txt)"
          if [ "$mac" != "$version" ] || [ "$win" != "$version" ] || [ "$linux" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match Info.plist ($mac), ProjectKey.rc ($win) and CMakeLists.txt ($linux)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-26  # NSGlassEffectView needs the macOS 26 SDK
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The trained dictionary and context models (tools/bigram-trainer/MODELS-NOTICE.txt).
      - run: tools/bigram-trainer/fetch-models.sh
      - run: platforms/macos/build.sh --require-models
      - run: ditto -c -k --keepParent platforms/macos/build/ProjectKey.app "ProjectKey-${{ needs.version.outputs.version }}-macos.zip"
      - run: platforms/macos/package.sh && mv platforms/macos/build/ProjectKey-*-macos.pkg .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: |
            ProjectKey-*-macos.zip
            ProjectKey-*-macos.pkg

  windows:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - run: tools/bigram-trainer/fetch-models.sh
        shell: bash
      - run: platforms/windows/build.ps1 -RequireModels
        shell: pwsh
      # The Scoop package runs install.ps1 -Source from the unpacked files.
      - shell: pwsh
        run: |
          Copy-Item platforms/windows/build/out package -Recurse
          Get-ChildItem package -Recurse -Include *.lib, *.exp | Remove-Item
          Copy-Item platforms/windows/install.ps1, platforms/windows/uninstall.ps1 package
          Compress-Archive package/* "ProjectKey-${{ needs.version.outputs.version }}-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: ProjectKey-*-windows-x64.zip

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git cmake ninja python curl fcitx5 enchant hunspell-en_us libxcb cairo pango wayland qt6-base libadwaita libsoup3 json-glib
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # makepkg refuses to run as root.
      - run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'cd platforms/linux/arch && makepkg --noconfirm -f'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch
          path: platforms/linux/arch/*.pkg.tar.zst
  linux-deb:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {suite: trixie, image: 'debian:trixie'}
          - {suite: noble, image: 'ubuntu:24.04'}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git curl make build-essential dpkg-dev debhelper fakeroot cmake ninja-build g++ python3 pkg-config \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev libenchant-2-dev libxcb1-dev libcairo2-dev libpango1.0-dev \
            libwayland-dev qt6-base-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh platforms/linux/package-deb.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb-${{ matrix.suite }}
          path: platforms/linux/dist/*.deb

  linux-rpm:
    needs: version
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - run: dnf install -y rpm-build make tar gzip findutils git curl cmake ninja-build gcc-c++ python3 pkgconf-pkg-config fcitx5-devel enchant2-devel libxcb-devel cairo-devel pango-devel wayland-devel qt6-qtbase-devel libadwaita-devel libsoup3-devel json-glib-devel
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh platforms/linux/package-rpm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm
          path: platforms/linux/dist/*.rpm

  # Signed apt and dnf repositories on the gh-pages branch (platforms/linux/publish-repos.sh).
  # REPO_GPG_PRIVATE_KEY: the armored private key, without a passphrase.
  linux-repos:
    needs: [version, release, linux-deb, linux-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: platforms/linux/publish-repos.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: deb-*
          path: in
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rpm
          path: in/rpm
      - env:
          KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c
          printf '%s\n' "$KEY" | gpg --batch --import
          export GPG_KEY="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          # Too large for the repositories (GitHub refuses 100 MB in a branch), so they are installed from the
          # release, with a signature each that the README has the reader check against the repositories' key.
          for data in in/deb-trixie/fcitx5-projectkey-data_*.deb in/rpm/fcitx5-projectkey-data-*.rpm; do
            gpg --batch --yes --armor --detach-sign -u "$GPG_KEY" -o "$data.asc" "$data"
            gh release upload "$GITHUB_REF_NAME" "$data" "$data.asc" --clobber --repo "$GITHUB_REPOSITORY"
          done
          sh platforms/linux/publish-repos.sh in site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apt rpm
          git commit -m "Linux repositories for ${{ needs.version.outputs.version }}"
          git push
  release:
    needs: [version, macos, windows, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            distribution
            platforms/linux/install.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - run: sha256sum ProjectKey-*.zip ProjectKey-*.pkg *.pkg.tar.zst > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes written for this version (distribution/README.md), or notes generated from the commits.
          notes="distribution/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then from=(--notes-file "$notes"); else from=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ProjectKey-*.zip ProjectKey-*.pkg *.pkg.tar.zst SHA256SUMS platforms/linux/install.sh --clobber
            if [ -f "$notes" ]; then gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"; fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Project Key ${{ needs.version.outputs.version }}" \
              "${from[@]}" ProjectKey-*.zip ProjectKey-*.pkg *.pkg.tar.zst SHA256SUMS platforms/linux/install.sh
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: SHA256SUMS

  packages:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASES: https://github.com/${{ github.repository }}/releases/download
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checksums
      - name: Homebrew cask and formula
        # bash -eo pipefail: a download that fails stops the step, rather than hashing nothing.
        shell: bash
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          sha="$(awk '/-macos.zip$/ { print $1 }' SHA256SUMS)"
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/KoukeNeko/homebrew-tap.git" tap
          cat > tap/Casks/project-key.rb <<EOF
          cask "project-key" do
            version "$VERSION"
            sha256 "$sha"

            url "https://github.com/KoukeNeko/Project-Key/releases/download/v#{version}/ProjectKey-#{version}-macos.zip"
            name "Project Key"
            desc "Zhuyin input method"
            homepage "https://github.com/KoukeNeko/Project-Key"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on arch: :arm64
            depends_on macos: :ventura

            input_method "ProjectKey.app"

            postflight do
              app = "#{Dir.home}/Library/Input Methods/ProjectKey.app"
              # Ad-hoc signed and not notarized: Gatekeeper refuses it while quarantined.
              system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", app]
              system_command "#{app}/Contents/MacOS/ProjectKey", args: ["--register"]
              system_command "/usr/bin/open", args: ["-g", app]
            end

            uninstall quit: "org.projectkey.inputmethod.ProjectKey"

            caveats "Add Project Key in System Settings > Keyboard > Input Sources."
          end
          EOF
          # Linux: a formula built from the tag's source against the distribution's own Fcitx5,
          # which loads the addon. Named apart from the cask, so macOS's `brew install project-key`
          # still finds the cask.
          mcb="$(curl -sSfL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/MCBOPOMOFO_COMMIT" | tr -d '[:space:]')"
          src_sha="$(curl -sSfL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | sha256sum | cut -d' ' -f1)"
          mcb_sha="$(curl -sSfL "https://github.com/openvanilla/McBopomofo/archive/$mcb.tar.gz" | sha256sum | cut -d' ' -f1)"
          # The trained dictionary and context models, as pinned by the tag's fetch-models.sh and models.sha256.
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/tools/bigram-trainer"
          models_tag="$(curl -sSfL "$raw/fetch-models.sh" | sed -n 's/^TAG=//p')"
          sums="$(curl -sSfL "$raw/models.sha256")"
          if [ -z "$mcb" ] || [ -z "$models_tag" ] || [ -z "$sums" ]; then
            echo "::error::could not read MCBOPOMOFO_COMMIT, the models tag or models.sha256" >&2
            exit 1
          fi
          models=""
          while read -r sum file; do
            models="$models  resource \"$file\" do\n    url \"https://github.com/KoukeNeko/Project-Key/releases/download/$models_tag/$file\"\n    sha256 \"$sum\"\n  end\n\n"
          done <<< "$sums"
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@MODELS_VERSION@/${models_tag#models-}/" -e "s/@SHA256@/$src_sha/" -e "s/@MCBOPOMOFO@/$mcb/" -e "s/@MCBOPOMOFO_SHA256@/$mcb_sha/" \
            > tap/Formula/fcitx5-projectkey.rb.in <<'EOF'
          class Fcitx5Projectkey < Formula
            desc "Zhuyin input method for Fcitx5"
            homepage "https://github.com/KoukeNeko/Project-Key"
            url "https://github.com/KoukeNeko/Project-Key/archive/refs/tags/v@VERSION@.tar.gz"
            sha256 "@SHA256@"
            license all_of: ["MIT", "CC-BY-SA-4.0", "LGPL-2.1-or-later", "Unicode-3.0"]  # the program; bigram.bin, chars.bin and sentence.bin; data.txt; emoji.txt

            livecheck do
              url :stable
              strategy :github_latest
            end

            depends_on "cmake" => :build
            depends_on "ninja" => :build
            depends_on :linux

            resource "mcbopomofo" do
              url "https://github.com/openvanilla/McBopomofo/archive/@MCBOPOMOFO@.tar.gz"
              sha256 "@MCBOPOMOFO_SHA256@"
            end

          @MODELS@
            def install
              # The addon is loaded by the distribution's Fcitx5, so it is built with the system's
              # compiler, against the system's Fcitx5, Qt and other libraries (see caveats).
              ENV["PKG_CONFIG"] = "/usr/bin/pkg-config"
              ENV["PKG_CONFIG_LIBDIR"] =
                Utils.safe_popen_read("/usr/bin/pkg-config", "--variable", "pc_path", "pkg-config").strip
              ENV.delete "PKG_CONFIG_PATH"
              (buildpath/"mcbopomofo").install resource("mcbopomofo")
              # CMakeLists.txt installs them, with their notice, from the trainer's cache.
              %w[data.txt bigram.bin chars.bin sentence.bin].each { |file| (buildpath/"tools/bigram-trainer/.cache").install resource(file) }
              (buildpath/"tools/bigram-trainer/.cache/models-version.txt").write "@MODELS_VERSION@\n"  # as fetch-models.sh records it
              system "make", "-C", "mcbopomofo/Source/Data", "data.txt", "associated-phrases-v2.txt"
              system "cmake", "-S", "platforms/linux", "-B", "build", "-G", "Ninja",
                     "-DCMAKE_C_COMPILER=/usr/bin/cc", "-DCMAKE_CXX_COMPILER=/usr/bin/c++",
                     "-DMCBOPOMOFO=#{buildpath}/mcbopomofo", "-DREQUIRE_MODELS=ON", *std_cmake_args
              system "cmake", "--build", "build"
              %w[ComposerTest ControllerTest].each { |test| system "build/#{test}", "mcbopomofo/Source/Data/data.txt" }
              system "cmake", "--install", "build"

              # Fcitx5, GNOME Shell and the desktop also read the user's data directory, where Homebrew
              # cannot write: projectkey-link links the files they read there, to opt so upgrades keep them.
              (bin/"projectkey-link").write <<~SH
                #!/bin/sh
                set -e
                data=${XDG_DATA_HOME:-$HOME/.local/share}
                for file in fcitx5/addon/projectkey.conf fcitx5/inputmethod/projectkey.conf fcitx5/themes/projectkey \\
                            gnome-shell/extensions/project-key@koukeneko.github.io applications/projectkey-settings.desktop \\
                            icons/hicolor/scalable/apps/fcitx-projectkey.svg \\
                            icons/hicolor/scalable/apps/fcitx-projectkey-symbolic.svg; do
                  mkdir -p "$data/$(dirname "$file")"
                  rm -rf "${data:?}/$file"
                  ln -s "#{opt_share}/$file" "$data/$file"
                done
                echo "Linked Project Key into $data. Restart Fcitx5 (fcitx5 -r), then run projectkey-settings --welcome to add it."
              SH
              chmod 0755, bin/"projectkey-link"
            end

            def caveats
              <<~EOS
                Built against the system's Fcitx5. On Debian or Ubuntu first install:
                  sudo apt install g++ python3 pkg-config libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev libenchant-2-dev libxcb1-dev libcairo2-dev libpango1.0-dev libwayland-dev qt6-base-dev libadwaita-1-dev libsoup-3.0-dev libjson-glib-dev hunspell-en-us fonts-noto-cjk
                (on Plasma 5, qtbase5-dev too).

                Then run projectkey-link once: it links the files Fcitx5 and GNOME read into ~/.local/share.
                Restart Fcitx5 (fcitx5 -r) and add Project Key in Fcitx5's input methods. On GNOME, log in
                again and turn on the Project Key extension in the Extensions app.
              EOS
            end

            test do
              assert_path_exists lib/"fcitx5/projectkey.so"
              assert_match "Library=#{lib}/fcitx5/projectkey", (share/"fcitx5/addon/projectkey.conf").read
            end
          end
          EOF
          MODELS="$models" python3 -c 'import os, sys; print(sys.stdin.read().replace("@MODELS@\n", os.environ["MODELS"].replace("\\n", "\n")), end="")' \
            < tap/Formula/fcitx5-projectkey.rb.in > tap/Formula/fcitx5-projectkey.rb
          rm tap/Formula/fcitx5-projectkey.rb.in
          cd tap
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "project-key $VERSION"
          git push
      - name: Scoop manifest
        shell: bash
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          sha="$(awk '/-windows-x64.zip$/ { print $1 }' SHA256SUMS)"
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/KoukeNeko/scoop-bucket.git" bucket
          # A Scoop update runs the old uninstaller first; install.ps1 replaces the files
          # in place, so only a real uninstall removes the keyboard and its files.
          jq -n --arg version "$VERSION" --arg hash "$sha" '{
            version: $version,
            description: "Zhuyin input method",
            homepage: "https://github.com/KoukeNeko/Project-Key",
            license: "MIT",
            notes: [
              "Installing and removing ask Windows for administrator rights: the input method is installed into C:\\Program Files\\Project Key and registered there.",
              "Add Project Key in Settings > Time & language > Language & region."
            ],
            architecture: {"64bit": {
              url: "https://github.com/KoukeNeko/Project-Key/releases/download/v\($version)/ProjectKey-\($version)-windows-x64.zip",
              hash: $hash
            }},
            installer: {script: "& \"$dir\\install.ps1\" -Source $dir"},
            uninstaller: {script: "if ($cmd -eq \"uninstall\") { & \"$dir\\uninstall.ps1\" }"},
            checkver: {github: "https://github.com/KoukeNeko/Project-Key"},
            autoupdate: {
              architecture: {"64bit": {url: "https://github.com/KoukeNeko/Project-Key/releases/download/v$version/ProjectKey-$version-windows-x64.zip"}},
              hash: {url: "https://github.com/KoukeNeko/Project-Key/releases/download/v$version/SHA256SUMS"}
            }
          }' > bucket/bucket/project-key.json
          cd bucket
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "project-key $VERSION"
          git push
